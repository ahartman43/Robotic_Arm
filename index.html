<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 IK Robotic Arm Controller</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }
    header {
      width: 100%;
      padding: 15px;
      background-color: #1e1e1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
    }
    h1 {
      margin: 0;
      font-size: 1.2rem;
      color: #00e676;
    }
    .btn {
      background-color: #2979ff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-disconnect {
      background-color: #ff1744;
      display: none;
    }
    .status-panel {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 5px;
    }
    .control-container {
      display: flex;
      width: 100%;
      height: 70vh;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
    }
    .stick-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stick-label {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #00e676;
    }
    .joystick-base {
      width: 170px;
      height: 170px;
      background: radial-gradient(circle, #2a2a2a 0%, #1a1a1a 100%);
      border: 4px solid #333;
      border-radius: 50%;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(0,230,118,0.2);
    }
    .joystick-handle {
      width: 55px;
      height: 55px;
      background: radial-gradient(circle, #2979ff 0%, #1565c0 100%);
      border: 2px solid #64b5f6;
      border-radius: 50%;
      position: absolute;
      top: 57.5px;
      left: 57.5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .claw-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff9100 0%, #d50000 100%);
      border: 4px solid #ffab40;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      transition: transform 0.1s, background 0.2s;
    }
    .claw-btn:active {
      transform: scale(0.92);
    }
    .claw-btn.open {
      background: radial-gradient(circle, #00e676 0%, #00a152 100%);
      border-color: #69f0ae;
    }
    footer {
      width: 100%;
      padding: 10px;
      background-color: #1e1e1e;
      text-align: center;
      font-family: monospace;
      font-size: 0.8rem;
      color: #777;
      border-top: 1px solid #333;
    }

    /* --- PAGE SWITCHING & TESTING CONSOLE STYLES --- */
    .view-section {
      display: none;
      width: 100%;
    }
    .view-section.active {
      display: flex;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background-color: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      touch-action: auto;
    }
    .tab-btn.active {
      background-color: #2979ff;
      color: #ffffff;
      border-color: #64b5f6;
    }
    .tuning-container {
      width: 100%;
      height: 70vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      touch-action: auto;
    }
    .tuning-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      touch-action: auto;
    }
    .tuning-card h3 {
      margin: 0 0 12px 0;
      color: #00e676;
      font-size: 1.05rem;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
    }
    .tuning-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      touch-action: auto;
    }
    .tuning-row label {
      font-size: 0.9rem;
      color: #ddd;
    }
    .tuning-row input[type="number"] {
      width: 65px;
      padding: 6px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #00e676;
      border-radius: 4px;
      text-align: center;
      font-size: 0.9rem;
      touch-action: auto;
    }
    .tuning-row select {
      padding: 6px 10px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 0.9rem;
      touch-action: auto;
    }
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 10px;
      touch-action: auto;
    }
    .toggle-switch input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #00e676;
      touch-action: auto;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>ESP32 IK Arm Controller</h1>
      <div id="status" class="status-panel">Status: Disconnected</div>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <!-- PAGE NAV TABS -->
      <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('controlView', this)">Arm Controller</button>
        <button class="tab-btn" onclick="switchTab('testingView', this)">Testing & Tuning</button>
      </nav>
      <button id="connectBtn" class="btn">Connect BLE</button>
      <button id="disconnectBtn" class="btn btn-disconnect">Disconnect</button>
    </div>
  </header>

  <!-- PAGE 1: ORIGINAL ARM CONTROLLER VIEW -->
  <div id="controlView" class="control-container view-section active">
    <!-- LEFT JOYSTICK: Base Spin (X) & Reach In/Out (Y) -->
    <div class="stick-wrapper">
      <div class="stick-label">Base & Reach (In/Out)</div>
      <div id="leftBase" class="joystick-base">
        <div id="leftHandle" class="joystick-handle"></div>
      </div>
    </div>

    <!-- CENTER JOYSTICK: Height Up/Down (Y-axis only) -->
    <div class="stick-wrapper">
      <div class="stick-label">Height (Up/Down)</div>
      <div id="heightBase" class="joystick-base">
        <div id="heightHandle" class="joystick-handle"></div>
      </div>
    </div>

    <!-- RIGHT BUTTON: Claw Toggle (Full Open / Full Close) -->
    <div class="stick-wrapper">
      <div class="stick-label">Claw Action</div>
      <div id="clawBtn" class="claw-btn">CLOSED</div>
    </div>
  </div>

  <!-- PAGE 2: TESTING & TUNING VIEW -->
  <div id="testingView" class="control-container view-section">
    <div class="tuning-container">
      
      <!-- CONTROL LOGIC CONFIGURATION -->
      <div class="tuning-card">
        <h3>Control Logic Settings</h3>
        <div class="tuning-row">
          <label for="controlToggle">Closed-Loop Control:</label>
          <div class="toggle-switch">
            <input type="checkbox" id="controlToggle" onchange="updateControlLogic()">
            <span id="controlStatusText" style="color: #ff1744; font-weight: bold;">OFF</span>
          </div>
        </div>
        <div class="tuning-row">
          <label for="controlStrategy">Control Strategy:</label>
          <select id="controlStrategy" onchange="updateControlLogic()">
            <option value="0">Inverse Kinematics (Default)</option>
            <option value="1">PID Speed Controller</option>
            <option value="2">Raw Manual Direct</option>
          </select>
        </div>
      </div>

      <!-- DYNAMIC SERVO RANGE BOUNDARIES -->
      <div class="tuning-card">
        <h3>Dynamic Servo Range Limits</h3>
        <div class="tuning-row">
          <label>Base Servo (°):</label>
          <div>
            Min: <input type="number" id="baseMin" value="0" min="0" max="180">
            Max: <input type="number" id="baseMax" value="180" min="0" max="180">
          </div>
        </div>
        <div class="tuning-row">
          <label>Shoulder Servo (°):</label>
          <div>
            Min: <input type="number" id="shoulderMin" value="15" min="0" max="180">
            Max: <input type="number" id="shoulderMax" value="165" min="0" max="180">
          </div>
        </div>
        <div class="tuning-row">
          <label>Elbow Servo (°):</label>
          <div>
            Min: <input type="number" id="elbowMin" value="10" min="0" max="180">
            Max: <input type="number" id="elbowMax" value="170" min="0" max="180">
          </div>
        </div>
        <button class="btn" style="width: 100%; margin-top: 8px;" onclick="sendServoLimits()">Sync Servo Limits</button>
      </div>

    </div>
  </div>

  <footer>
    <span id="packetDisplay">Packet Out: J:0,0,0,0</span>
  </footer>

  <script>
    const SERVICE_UUID  = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_RX_UUID  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxCharacteristic = null;

    // Control values
    let baseSpin = 0;   // Base Spin (Left Stick X)
    let reachVal = 0;   // Reach In/Out (Left Stick Y)
    let heightVal = 0;  // Height Up/Down (Center Stick Y)
    let clawState = 0;  // Claw Button: 0 = Closed, 1 = Open

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusDiv = document.getElementById('status');
    const packetDisplay = document.getElementById('packetDisplay');
    const clawBtn = document.getElementById('clawBtn');

    // --- TAB SWITCHING LOGIC ---
    function switchTab(viewId, btn) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(viewId).classList.add('active');
      btn.classList.add('active');
    }

    // --- BLE CONNECT ---
    connectBtn.addEventListener('click', async () => {
      try {
        statusDiv.innerText = "Status: Searching for BLE device...";
        
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'S3_ARM_BLE' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(CHAR_RX_UUID);

        statusDiv.innerText = "Status: Connected to S3_ARM_BLE";
        statusDiv.style.color = "#00e676";
        connectBtn.style.display = 'none';
        disconnectBtn.style.display = 'inline-block';

        startTransmissionLoop();

      } catch (error) {
        console.error(error);
        statusDiv.innerText = "Status: Connection Failed - " + error.message;
        statusDiv.style.color = "#ff1744";
      }
    });

    disconnectBtn.addEventListener('click', () => {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    });

    function onDisconnected() {
      statusDiv.innerText = "Status: Disconnected";
      statusDiv.style.color = "#aaa";
      connectBtn.style.display = 'inline-block';
      disconnectBtn.style.display = 'none';
      rxCharacteristic = null;
    }

    // --- CLAW BUTTON TOGGLE ---
    clawBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      clawState = clawState === 0 ? 1 : 0;
      if (clawState === 1) {
        clawBtn.innerText = "OPEN";
        clawBtn.classList.add('open');
      } else {
        clawBtn.innerText = "CLOSED";
        clawBtn.classList.remove('open');
      }
    });

    // --- JOYSTICK TOUCH LOGIC ---
    function setupJoystick(baseId, handleId, lockX, onChange) {
      const base = document.getElementById(baseId);
      const handle = document.getElementById(handleId);

      const maxRadius = 55;
      let activeTouchId = null;

      function updatePosition(clientX, clientY) {
        const rect = base.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let deltaX = lockX ? 0 : clientX - centerX;
        let deltaY = clientY - centerY;

        const distance = Math.hypot(deltaX, deltaY);

        if (distance > maxRadius) {
          deltaX = (deltaX / distance) * maxRadius;
          deltaY = (deltaY / distance) * maxRadius;
        }

        handle.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

        const normX = Math.round((deltaX / maxRadius) * 100);
        const normY = Math.round((-deltaY / maxRadius) * 100);

        onChange(normX, normY);
      }

      function resetPosition() {
        handle.style.transform = `translate(0px, 0px)`;
        onChange(0, 0);
      }

      base.addEventListener('touchstart', (e) => {
        if (activeTouchId === null) {
          const touch = e.changedTouches[0];
          activeTouchId = touch.identifier;
          updatePosition(touch.clientX, touch.clientY);
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (activeTouchId !== null) {
          for (let touch of e.changedTouches) {
            if (touch.identifier === activeTouchId) {
              updatePosition(touch.clientX, touch.clientY);
            }
          }
        }
      });

      window.addEventListener('touchend', (e) => {
        if (activeTouchId !== null) {
          for (let touch of e.changedTouches) {
            if (touch.identifier === activeTouchId) {
              activeTouchId = null;
              resetPosition();
            }
          }
        }
      });

      let isMouseDown = false;
      base.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        updatePosition(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        if (isMouseDown) updatePosition(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', () => {
        if (isMouseDown) {
          isMouseDown = false;
          resetPosition();
        }
      });
    }

    // Attach controllers
    setupJoystick('leftBase', 'leftHandle', false, (x, y) => {
      baseSpin = x;
      reachVal = y;
    });

    setupJoystick('heightBase', 'heightHandle', true, (x, y) => {
      heightVal = y;
    });

    // --- TESTING & TUNING PARAMETER TRANSMISSION ---
    async function sendBLEPacket(packetStr) {
      packetDisplay.innerText = "Packet Out: " + packetStr;
      if (rxCharacteristic && bleDevice && bleDevice.gatt.connected) {
        try {
          const encoder = new TextEncoder();
          await rxCharacteristic.writeValueWithoutResponse(encoder.encode(packetStr));
        } catch (err) {
          console.warn("BLE Write Error: ", err);
        }
      }
    }

    function updateControlLogic() {
      const enabled = document.getElementById('controlToggle').checked ? 1 : 0;
      const strategy = document.getElementById('controlStrategy').value;
      
      const statusText = document.getElementById('controlStatusText');
      statusText.innerText = enabled ? "ON" : "OFF";
      statusText.style.color = enabled ? "#00e676" : "#ff1744";

      // Packet format: "C:Enabled,Strategy"
      sendBLEPacket(`C:${enabled},${strategy}`);
    }

    function sendServoLimits() {
      const bMin = document.getElementById('baseMin').value;
      const bMax = document.getElementById('baseMax').value;
      const sMin = document.getElementById('shoulderMin').value;
      const sMax = document.getElementById('shoulderMax').value;
      const eMin = document.getElementById('elbowMin').value;
      const eMax = document.getElementById('elbowMax').value;

      // Packet format: "L:BaseMin,BaseMax,ShoulderMin,ShoulderMax,ElbowMin,ElbowMax"
      sendBLEPacket(`L:${bMin},${bMax},${sMin},${sMax},${eMin},${eMax}`);
    }

    // --- BLE CONTINUOUS STREAM (50 Hz) ---
    let transmissionTimer = null;

    function startTransmissionLoop() {
      if (transmissionTimer) clearInterval(transmissionTimer);

      transmissionTimer = setInterval(async () => {
        if (rxCharacteristic && bleDevice.gatt.connected) {
          // Packet format: "J:BaseSpin,ReachVal,ClawState,HeightVal"
          const packetStr = `J:${baseSpin},${reachVal},${clawState},${heightVal}`;
          sendBLEPacket(packetStr);
        }
      }, 30);
    }
  </script>
</body>
</html>
