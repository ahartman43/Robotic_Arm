<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your App Title</title>
  
  <!-- KEEP ALL YOUR EXISTING CSS STYLES HERE -->
  <style>
    /* ... Your original CSS goes here ... */

    /* Add just these few helper classes for switching pages: */
    .view-section { display: none; }
    .view-section.active { display: block; }
    
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 16px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f0f0f0;
      border-radius: 4px;
    }
    .tab-btn.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }
  </style>
</head>
<body>

  <!-- 1. NAVIGATION TAB BAR -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('mainView', this)">Main Interface</button>
    <button class="tab-btn" onclick="switchTab('testingView', this)">Testing & Tuning</button>
  </nav>

  <!-- 2. YOUR ORIGINAL EXACT INDEX HTML GOES INSIDE THIS SECTION -->
  <section id="mainView" class="view-section active">
    
    <!-- PASTE YOUR EXACT ORIGINAL INDEX.HTML CONTENT HERE -->
    
  </section>

  <!-- 3. NEW TESTING & TUNING PAGE -->
  <section id="testingView" class="view-section">
    <div class="testing-panel">
      <h2>Control & Servo Tuning Console</h2>

      <!-- Control Logic Mode Switch -->
      <fieldset style="margin-bottom: 15px; padding: 15px;">
        <legend>Control Logic Mode</legend>
        <label>
          <input type="checkbox" id="controlToggle" onchange="toggleControlLogic()">
          Enable Closed-Loop Control
        </label>
        <div style="margin-top: 10px;">
          <label for="controlMode">Strategy:</label>
          <select id="controlMode" onchange="updateControlMode()">
            <option value="pid">PID Controller</option>
            <option value="bangbang">Bang-Bang / Threshold</option>
            <option value="kinematic">Inverse Kinematics</option>
          </select>
        </div>
      </fieldset>

      <!-- Dynamic Servo Boundary Limits -->
      <fieldset style="padding: 15px;">
        <legend>Servo Dynamic Safety Boundaries</legend>
        
        <div style="margin-bottom: 10px;">
          <strong>Axis 1:</strong> 
          Min: <input type="number" id="servo1_min" value="0" style="width: 60px;">
          Max: <input type="number" id="servo1_max" value="180" style="width: 60px;">
        </div>

        <div style="margin-bottom: 10px;">
          <strong>Axis 2:</strong> 
          Min: <input type="number" id="servo2_min" value="15" style="width: 60px;">
          Max: <input type="number" id="servo2_max" value="165" style="width: 60px;">
        </div>

        <div style="margin-bottom: 10px;">
          <strong>Axis 3:</strong> 
          Min: <input type="number" id="servo3_min" value="10" style="width: 60px;">
          Max: <input type="number" id="servo3_max" value="170" style="width: 60px;">
        </div>

        <button onclick="applyServoLimits()" style="margin-top: 10px; padding: 6px 12px;">Apply Limits</button>
      </fieldset>
    </div>
  </section>

  <!-- 4. TAB SWITCHING SCRIPT -->
  <script>
    function switchTab(viewId, btn) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(viewId).classList.add('active');
      btn.classList.add('active');
    }

    // Testing logic calls
    function toggleControlLogic() {
      const isChecked = document.getElementById('controlToggle').checked;
      fetch('/api/control/enable', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: isChecked })
      }).catch(err => console.log('Mock/Offline Mode'));
    }

    function updateControlMode() {
      const mode = document.getElementById('controlMode').value;
      fetch('/api/control/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: mode })
      }).catch(err => console.log('Mock/Offline Mode'));
    }

    function applyServoLimits() {
      const limits = {
        servo1: { min: parseInt(document.getElementById('servo1_min').value), max: parseInt(document.getElementById('servo1_max').value) },
        servo2: { min: parseInt(document.getElementById('servo2_min').value), max: parseInt(document.getElementById('servo2_max').value) },
        servo3: { min: parseInt(document.getElementById('servo3_min').value), max: parseInt(document.getElementById('servo3_max').value) }
      };
      
      fetch('/api/servos/limits', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(limits)
      }).catch(err => console.log('Mock/Offline Mode'));
    }
  </script>

  <!-- KEEP YOUR ORIGINAL JAVASCRIPT CODE AT THE BOTTOM AS WELL -->

</body>
</html>
